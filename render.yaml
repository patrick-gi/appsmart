services:
  - type: web
    runtime: node
    name: applesmart
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: applesmart-db
          property: connectionString

databases:
  - name: applesmart-db
    plan: free
