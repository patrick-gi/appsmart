<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Applesmart: used Apple devices, local pickup</title>
<meta name="description" content="Buy and sell used iPhones, iPads, Macs, Apple Watches and AirPods near you. Check battery health and Activation Lock before you meet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230E6B5C'/%3E%3Cpath d='M5 12a7 7 0 1 0 2.3-5.2M5 5v5h5' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}

/* Layout: sticky header, filter rail + listing grid; item page = photos | inspection sheet + chat. Price shown as a yellow swing tag. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#E3E9E7; --ink:#13201E; --muted:#566865; --line:#D3DCDA;
  --accent:#0E6B5C; --accent-ink:#FFFFFF; --accent-soft:#D7ECE7;
  --tag:#F4C542; --tag-ink:#231B00;
  --ok:#1C7843; --warn:#9A5800; --bad:#B3261E;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1413; --surface:#15201E; --sunk:#1B2826; --ink:#E5EEEB; --muted:#93A6A2; --line:#26342F;
  --accent:#43B79F; --accent-ink:#03130F; --accent-soft:#173A33;
  --tag:#E9BC32; --tag-ink:#1A1400;
  --ok:#5CC28A; --warn:#E3A24A; --bad:#F2867D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1413; --surface:#15201E; --sunk:#1B2826; --ink:#E5EEEB; --muted:#93A6A2; --line:#26342F;
  --accent:#43B79F; --accent-ink:#03130F; --accent-soft:#173A33;
  --tag:#E9BC32; --tag-ink:#1A1400;
  --ok:#5CC28A; --warn:#E3A24A; --bad:#F2867D; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand .dot{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.nav{display:flex;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center}
.who{display:flex;align-items:center;gap:8px}
.who img{width:30px;height:30px;border-radius:50%}

main{padding-block:22px 60px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:18px;font-size:14px}
.notice.warn{background:var(--sunk)}

/* browse */
.browse{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);display:flex;flex-direction:column;gap:18px}
.rail fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.rail legend{padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13.5px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:13.5px}
.field input,.field select,.field textarea{padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%;min-width:0}
.field .hint{font-size:12.5px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--accent)}

.listhead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.listhead h1{font-size:clamp(24px,3.4vw,34px);font-weight:800;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:var(--muted)}
.card .ph{aspect-ratio:4/3;background:var(--sunk);display:grid;place-items:center;color:var(--muted);max-width:100%;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font-size:16.5px;font-weight:700}
.specline{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:11.5px;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--ink);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);padding-top:4px}

/* the swing tag */
.tag{position:absolute;top:12px;right:-4px;background:var(--tag);color:var(--tag-ink);font-family:var(--display);font-weight:800;font-size:19px;padding:5px 14px 5px 22px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%);transform:rotate(3deg);box-shadow:0 2px 0 rgba(0,0,0,.12);font-variant-numeric:tabular-nums}
.tag::before{content:"";position:absolute;left:9px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--surface)}
.tag.big{position:static;display:inline-block;font-size:30px;padding:6px 20px 6px 30px;transform:rotate(-1.5deg)}
.status{position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--ink);color:var(--bg)}
.status.reserved{background:var(--warn);color:#fff}
.sample-flag{position:absolute;bottom:8px;left:8px;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--surface);color:var(--muted);border:1px dashed var(--muted)}
.heart{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.heart[aria-pressed="true"]{color:var(--bad)}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 22px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--surface)}
.empty h2{font-size:22px}

/* item */
.back{margin-bottom:14px}
.item{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.gallery{display:flex;flex-direction:column;gap:10px}
.gallery .main{aspect-ratio:4/3;background:var(--sunk);border-radius:var(--r);overflow:hidden;display:grid;place-items:center;color:var(--muted);max-width:100%;position:relative}
.gallery .main img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{width:68px;height:52px;border-radius:7px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:var(--sunk)}
.thumbs button[aria-current="true"]{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.side{display:flex;flex-direction:column;gap:18px;min-width:0}
.side h1{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.015em}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr}
.sheet dt,.sheet dd{padding:9px 14px;border-bottom:1px solid var(--line);margin:0}
.sheet dt{color:var(--muted);font-size:13.5px}
.sheet dd{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.sheet dl > :nth-last-child(-n+2){border-bottom:0}
.meter{display:inline-block;width:70px;height:7px;border-radius:4px;background:var(--sunk);vertical-align:middle;margin-right:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.desc{white-space:pre-wrap;max-width:65ch}
.seller{display:flex;align-items:center;gap:10px}
.seller img{width:38px;height:38px;border-radius:50%}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--sunk);padding:10px 12px;border-radius:8px;font-size:14px}

/* chat */
.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
.chat .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.msgs{display:flex;flex-direction:column;gap:8px;padding:14px;max-height:340px;overflow-y:auto;min-height:120px}
.msg{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--sunk);align-self:flex-start;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg .t{font-size:11px;opacity:.7;margin-top:2px}
.msg.sys{align-self:center;background:transparent;border:1px dashed var(--line);font-size:13px;color:var(--muted);text-align:center}
.msg.offer{border:2px solid var(--tag);background:var(--surface);color:var(--ink)}
.msg.offer b{font-family:var(--display);font-size:18px}
.compose{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);flex-wrap:wrap}
.compose input{flex:1 1 160px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.offerrow{display:flex;gap:8px;padding:0 10px 10px;align-items:center;flex-wrap:wrap}
.offerrow input{width:110px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}

/* sell */
.sell{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);gap:28px;align-items:start}
.form{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:1px solid var(--line);border-radius:8px;padding:8px 11px;cursor:pointer;font-size:13.5px;display:flex;gap:6px;align-items:center}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--bg)}
.prevs{display:flex;gap:8px;flex-wrap:wrap}
.prevs figure{margin:0;width:84px;height:64px;border-radius:7px;overflow:hidden;position:relative;background:var(--sunk)}
.prevs img{width:100%;height:100%;object-fit:cover}
.prevs button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:var(--surface);cursor:pointer;font-size:13px;line-height:1}
.err{color:var(--bad);font-size:13.5px}
.preview-col{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);display:flex;flex-direction:column;gap:12px}

/* inbox */
.inbox{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.threads{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.th{display:flex;gap:10px;padding:11px 13px;border:0;border-bottom:1px solid var(--line);width:100%;background:transparent;text-align:left;cursor:pointer;align-items:center}
.th:last-child{border-bottom:0}
.th[aria-current="true"]{background:var(--accent-soft)}
.th img{width:34px;height:34px;border-radius:50%;flex:none}
.th .tx{min-width:0;flex:1}
.th .tx div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}

.mobile-filter{display:none}
@media (max-width:860px){
  .browse{grid-template-columns:1fr}
  .rail{position:static;display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .rail.open{display:flex}
  .mobile-filter{display:inline-flex}
  .item,.sell,.inbox{grid-template-columns:1fr}
  .preview-col{position:static}
}
@media (max-width:520px){
  .row2{grid-template-columns:1fr}
  .nav .lbl{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .tag{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.avatar{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none;letter-spacing:.02em}
.auth{max-width:440px;margin:24px auto}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
.who .btn{padding:7px 10px}
@media (max-width:520px){.who .btn{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#browse" aria-label="Applesmart home">
      <span class="dot"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg></span>
      <b>Applesmart</b>
    </a>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search iPhone 15, MacBook Air M2, AirPods…" aria-label="Search listings">
    </div>
    <nav class="nav">
      <a class="btn ghost" href="#inbox" id="inboxBtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="lbl">Messages</span><span id="unread"></span></a>
      <a class="btn primary" href="#sell"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Sell a device</span></a>
      <span class="who" id="who"></span>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/app.js"></script>
</body>
</html>
